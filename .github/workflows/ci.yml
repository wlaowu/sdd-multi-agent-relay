name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run zero-dependency smoke tests
        run: npm test
      - name: Validate install.sh syntax on POSIX
        if: runner.os == 'Linux'
        run: bash -n install.sh
